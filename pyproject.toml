[project]
name = "flight-radar"
version = "0.1.0"
description = "Personal flight price tracker with Telegram alerts"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.scripts]
track = "flight_radar.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/flight_radar"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
