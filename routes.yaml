# 감시할 노선. 이 파일만 고치면 추적 대상이 바뀝니다.
#
# window       : 여행 전체가 들어가야 하는 바깥 창.
#                depart_from 이후 출발, return_by 이전 귀국.
# trip_nights  : 후보 박수. 창을 벗어나는 조합은 자동으로 빠집니다
# target_price_krw : 이 값 이하면 무조건 알림. 실제 시장가보다 높게 잡으면
#                이 조건이 항상 이겨서 percentile 판정이 발사되지 않습니다.
#                2026-08-25 재조정: 64일 곡선 전체가 아니라 **최근 14일 구간**에
#                맞췄다. 출발이 6주 앞이라 6~7월 저가를 기준 삼으면 영원히
#                침묵한다. 목표는 바닥이 아니라 '그 구간에서 괜찮은 값' —
#                최근 14일 중 3~4일 걸리는 선. 오픈조는 곡선이 없어 관측
#                최저 대비 -4% 선으로 잡았다
# split_hubs   : 분리 발권 비교에 쓸 유럽 허브 (인천→허브 + 허브→목적지)
# return_from  : 오픈조. 귀국을 시작하는 공항. 생략하면 destination (= 보통의 왕복)
# depart_until : 출발일 상한. 오픈조는 조회 1건이 유료 한도를 깎으므로 좁힌다
# return_after : 귀국일 하한. 현지에 못 미루는 일정이 있으면 그 이전 귀국은 무효다
# provider     : 이 노선의 가격 출처. 워크플로가 이 값으로 노선을 고른다
# constraints  : 알림 자격 필터. 수집은 전부 하고 알림에서만 걸러냅니다

routes:
  - id: icn-lis
    origin: ICN
    destination: LIS
    window:
      depart_from: 2026-10-05
      return_by: 2026-10-16
    trip_nights: [7, 8, 9, 10, 11]
    target_price_krw: 1000000  # 최근 14일 4/14. 105만은 9/14로 그 구간 중앙값이라 신호가 못 된다
    split_hubs: [CDG, AMS, IST, DOH]
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []

  - id: icn-opo
    origin: ICN
    destination: OPO
    window:
      depart_from: 2026-10-05
      return_by: 2026-10-16
    trip_nights: [7, 8, 9, 10, 11]
    target_price_krw: 1250000  # 최근 14일 3/14. 115만은 1/14로 사실상 침묵이었다
    split_hubs: [CDG, AMS, IST, DOH]
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []

  # 오픈조 — 리스본으로 들어가 마드리드에서 나온다.
  # Google이 다구간 결과를 서버 렌더링하지 않아 SerpApi로만 조회된다.
  # 무료 한도가 월 250회뿐이라 7쌍 × 매일 = 월 217회에 맞췄다.
  # 포르투 out은 2026-09-01에 뺐다 — 왕복 대비 +26만까지 벌어져 후보에서
  # 밀렸고, 그 비용으로 마드리드를 매일 보는 편이 낫다. 필요하면 되살린다.
  - id: icn-lis-mad
    origin: ICN
    destination: LIS
    return_from: MAD
    provider: serpapi_openjaw
    window:
      depart_from: 2026-10-06
      depart_until: 2026-10-07
      # 2026-10-13 마드리드 아틀레티코 경기 예매 완료. 그 전 귀국은 무효다.
      return_after: 2026-10-14
      return_by: 2026-10-16
    trip_nights: [7, 8, 9, 10, 11]
    target_price_krw: 1450000  # 2026-09-01 시세 149.5만에서 -4.5만. 122만은 도달 불가라 침묵했다
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []
