# 감시할 노선. 이 파일만 고치면 추적 대상이 바뀝니다.
#
# window       : 여행 전체가 들어가야 하는 바깥 창.
#                depart_from 이후 출발, return_by 이전 귀국.
# trip_nights  : 후보 박수. 창을 벗어나는 조합은 자동으로 빠집니다
# target_price_krw : 이 값 이하면 무조건 알림. 실제 시장가보다 높게 잡으면
#                이 조건이 항상 이겨서 percentile 판정이 발사되지 않습니다
# split_hubs   : 분리 발권 비교에 쓸 유럽 허브 (인천→허브 + 허브→목적지)
# return_from  : 오픈조. 귀국을 시작하는 공항. 생략하면 destination (= 보통의 왕복)
# depart_until : 출발일 상한. 오픈조는 조회 1건이 유료 한도를 깎으므로 좁힌다
# provider     : 이 노선의 가격 출처. 워크플로가 이 값으로 노선을 고른다
# constraints  : 알림 자격 필터. 수집은 전부 하고 알림에서만 걸러냅니다

routes:
  - id: icn-lis
    origin: ICN
    destination: LIS
    window:
      depart_from: 2026-10-05
      return_by: 2026-10-16
    trip_nights: [7, 8, 9, 10, 11]
    target_price_krw: 1050000
    split_hubs: [CDG, AMS, IST, DOH]
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []

  - id: icn-opo
    origin: ICN
    destination: OPO
    window:
      depart_from: 2026-10-05
      return_by: 2026-10-16
    trip_nights: [7, 8, 9, 10, 11]
    target_price_krw: 1150000
    split_hubs: [CDG, AMS, IST, DOH]
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []

  # 오픈조 — 리스본으로 들어가 다른 도시에서 나온다.
  # Google이 다구간 결과를 서버 렌더링하지 않아 SerpApi로만 조회된다.
  # 무료 한도가 월 250회뿐이라 주 2회 × 2조합 × 7쌍 = 월 122회에 맞췄다.
  - id: icn-lis-opo
    origin: ICN
    destination: LIS
    return_from: OPO
    provider: serpapi_openjaw
    window:
      depart_from: 2026-10-06
      depart_until: 2026-10-07
      return_by: 2026-10-16
    trip_nights: [7, 8, 9, 10, 11]
    target_price_krw: 1300000
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []

  - id: icn-lis-mad
    origin: ICN
    destination: LIS
    return_from: MAD
    provider: serpapi_openjaw
    window:
      depart_from: 2026-10-06
      depart_until: 2026-10-07
      return_by: 2026-10-16
    trip_nights: [7, 8, 9, 10, 11]
    target_price_krw: 1200000
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []
