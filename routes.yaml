# 감시할 노선. 이 파일만 고치면 추적 대상이 바뀝니다.
#
# depart_window : 출발일 후보 범위 (±3일 유연 → 7일 창)
# trip_nights   : 여행 박수 후보. 여러 개면 조합이 늘어납니다
# target_price_krw : 이 값 이하면 무조건 알림
# split_hubs    : 분리 발권 비교에 쓸 유럽 허브 (인천→허브 + 허브→목적지)
# constraints   : 알림 자격 필터. 수집은 전부 하고 알림에서만 걸러냅니다
#
# TODO: depart_window 를 실제 출발 예정일 ±3일로 교체할 것 (현재는 자리표시자)

routes:
  - id: icn-lis
    origin: ICN
    destination: LIS
    depart_window:
      from: 2026-10-12
      to: 2026-10-18
    trip_nights: [9, 10, 11]
    target_price_krw: 1400000
    split_hubs: [CDG, AMS, IST, DOH]
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []

  - id: icn-opo
    origin: ICN
    destination: OPO
    depart_window:
      from: 2026-10-12
      to: 2026-10-18
    trip_nights: [9, 10, 11]
    target_price_krw: 1400000
    split_hubs: [CDG, AMS, IST, DOH]
    constraints:
      max_stops: 1
      max_duration_minutes: 1380
      exclude_carriers: []
